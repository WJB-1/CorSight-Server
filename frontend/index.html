<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorSight Console</title>
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <nav id="topbar">
    <span class="logo">CorSight</span>
    <div class="nav-links">
      <a href="#" data-page="map" class="active">地图</a>
      <a href="#" data-page="console">控制台</a>
      <button id="btn-layer-switch" class="btn-layer-switch" title="切换卫星/地图">🛰️ 卫星</button>
      <button id="btn-traffic" class="btn-layer-switch" title="显示/隐藏路况">🚦 路况</button>
      <span class="nav-sep">|</span>
      <button id="btn-draw-polygon" class="btn-layer-switch" title="绘制多边形标注">⬠ 画区域</button>
      <button id="btn-draw-line" class="btn-layer-switch" title="按住 Shift 吸附到上一条路径终点">╱ 画线</button>
      <button id="btn-draw-cancel" class="btn-layer-switch" title="取消绘制" style="display:none">✕ 取消</button>
    </div>
  </nav>

  <!-- 页面容器 -->
  <main id="app">
    <!-- 地图页面 -->
    <div id="page-map" class="page active">
      <div id="map"></div>
    </div>

    <!-- 控制台页面 -->
    <div id="page-console" class="page">
      <div id="console-header">
        <h3>实时日志</h3>
        <button id="btn-console-clear" class="btn-small">清空</button>
      </div>
      <div id="console-body"></div>
    </div>
  </main>

  <script src="/vendor/maplibre-gl.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
