<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorSight Console</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <div id="app"></div>
  <script>
    // 支持通过 URL 参数或 localStorage 设置后端地址
    // 例如: ?api_base=https://xxx.ngrok-free.app
    const params = new URLSearchParams(location.search);
    const apiBase = params.get('api_base') || localStorage.getItem('API_BASE_URL');
    if (apiBase) {
      window.API_BASE_URL = apiBase.replace(/\/$/, '');
      localStorage.setItem('API_BASE_URL', window.API_BASE_URL);
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
